# Credo Production Docker Compose Deployment Manifest
# All internal services run within the isolated 'credo_net' bridge network.
# Database and Redis ports are NOT exposed to the host network.

services:
  postgres:
    image: postgres:16-alpine
    container_name: credo_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-credo}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - credo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: credo_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - credo_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credo_prod_backend
    restart: always
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-credo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-credo}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://credo.app}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - credo_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credo_prod_worker
    restart: always
    command: uv run arq app.workers.worker.WorkerSettings
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-credo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-credo}
      REDIS_URL: redis://redis:6379/0
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - credo_net

networks:
  credo_net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
