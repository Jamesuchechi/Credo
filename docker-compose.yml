# SECURITY NOTICE: Database and Redis ports are bound to 127.0.0.1 for local dev.
# NEVER publish 5432 or 6379 to 0.0.0.0 or public networks in production environments!

services:
  postgres:
    image: postgres:16-alpine
    container_name: credo_postgres
    restart: always
    environment:
      POSTGRES_USER: credo
      POSTGRES_PASSWORD: credopassword
      POSTGRES_DB: credo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credo -d credo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: credo_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
