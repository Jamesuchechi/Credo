<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Credo Shield</title>
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      color: #38bdf8;
    }
    .score-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .score-val {
      font-size: 2.2rem;
      font-weight: 800;
      color: #10b981;
    }
    .score-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0369a1;
    }
    .status {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Credo Shield</div>
    <span style="font-size:0.75rem; color:#64748b;">v1.0</span>
  </div>

  <div class="score-card">
    <div class="score-label">Current Page Rating</div>
    <div id="score" class="score-val">--</div>
    <div id="verdict" class="status">Click below to check active page</div>
  </div>

  <button id="analyzeBtn">Analyze Current Page</button>

  <script src="popup.js"></script>
</body>
</html>
