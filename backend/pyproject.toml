[project]
name = "credo-backend"
version = "0.1.0"
description = "Credo multi-modal credibility infrastructure engine backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.4",
    "arq>=0.25.0",
    "pyjwt[crypto]>=2.8.0",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.27.0",
    "trafilatura>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.1.0",
    "python-whois>=0.8.0",
    "email-validator>=2.1.0",
    "pillow>=12.3.0",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "DTZ003", "G201", "RUF012"]
